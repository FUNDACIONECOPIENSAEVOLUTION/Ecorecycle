name: ECORECYCLE lote 01 metales
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/lote01_metales.py'
      - '.github/workflows/lote01-metales.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/lote01_metales.py
      - name: Publicar imagenes con origen y nombres exactos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/biblioteca/metales
          if ! git diff --cached --quiet; then
            git commit -m "Biblioteca visual: lote 01 de metales"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
