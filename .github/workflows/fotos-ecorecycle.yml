name: Construir galería fotográfica pública ECORECYCLE
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/descargar_fotos_abiertas.py'
      - '.github/workflows/fotos-ecorecycle.yml'
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/descargar_fotos_abiertas.py
      - name: Publicar imágenes permitidas y sus créditos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fotos
          if ! git diff --cached --quiet; then
            git commit -m "Añadir fotografías abiertas a galería ECORECYCLE"
            git push
          fi
