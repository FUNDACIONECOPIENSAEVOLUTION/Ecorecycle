name: ECORECYCLE paquete 01 reciclables secos
on:
  push:
    paths:
      - 'scripts/lote01_reciclables_blobs.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montar_biblioteca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Extraer diez imágenes originales por su nombre
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publicar_lote01_reciclables.py
      - name: Publicar imágenes y manifest sin archivos temporales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/biblioteca/reciclables-secos
          git rm -f scripts/lote01_reciclables_blobs.json
          git commit -m "Lote 01 reciclables: 10 imágenes locales sin logos recreados"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
