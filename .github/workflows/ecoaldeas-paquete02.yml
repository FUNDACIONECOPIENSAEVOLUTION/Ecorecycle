name: ECOALDEAS publicar paquete 02
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publicar_ecoaldeas_paquete02.py'
      - '.github/workflows/ecoaldeas-paquete02.yml'
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Crear las diez imágenes originales del Paquete 02
        run: python scripts/publicar_ecoaldeas_paquete02.py
      - name: Verificar imágenes y nombres individuales
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          base=Path('assets/biblioteca/ecoaldeas/paquete-02')
          imgs=json.loads((base/'manifest.json').read_text('utf8'))['imagenes']
          assert len(imgs)==10
          assert len(set(x['id'] for x in imgs))==10
          assert len(set(x['nombre'] for x in imgs))==10
          for x in imgs:
            f=Path(x['archivo'])
            assert f.is_file() and f.stat().st_size>20000,x
            with Image.open(f) as im: assert im.size==(1200,760)
          assert (base/'VISTA_PREVIA_PAQUETE02.jpg').is_file()
          print('PAQUETE 02 VALIDADO: 10 JPG, nombres y vista previa')
          PY
      - name: Publicar imágenes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/biblioteca/ecoaldeas/paquete-02
          if ! git diff --cached --quiet; then
            git commit -m "Publicar paquete 02 ECOALDEAS: diez procesos internos"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
