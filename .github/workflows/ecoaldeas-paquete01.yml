name: ECOALDEAS crear paquete 01 imágenes locales
on:
  push:
    paths:
      - 'scripts/publicar_ecoaldeas_paquete01.py'
      - '.github/workflows/ecoaldeas-paquete01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/publicar_ecoaldeas_paquete01.py
      - name: Verificar correspondencias
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/biblioteca/ecoaldeas/paquete-01/manifest.json').read_text('utf-8'))
          assert len(d['imagenes'])==10
          assert len({x['nombre'] for x in d['imagenes']})==10
          for item in d['imagenes']:
            assert Path(item['archivo']).is_file(),item
            assert Path(item['archivo']).stat().st_size>10000,item
          print('VERIFICADO: 10 imágenes y nombres distintos')
          PY
      - name: Guardar imágenes y manifiesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/biblioteca/ecoaldeas/paquete-01/
          if ! git diff --cached --quiet; then
            git commit -m "ECOALDEAS: 10 imágenes locales con nombres correspondientes"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
